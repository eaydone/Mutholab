# The site is built locally (npm run build → out/) and the prebuilt out/
# directory is uploaded with the deploy, so no remote build step is needed.
[build]
  command = "echo 'using prebuilt out/'"
  publish = "out"

# Pretty URLs for client-rendered job pages: /careers/<slug> serves the
# static careers-view page, which reads the slug from the URL path.
[[redirects]]
  from = "/careers/*"
  to = "/careers-view.html"
  status = 200
